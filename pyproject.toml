[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-checker"
version = "2.0.0"
description = "CLI to triage IPs, domains, URLs and file hashes against VirusTotal and AbuseIPDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eduardo Fernandes" }]
keywords = ["ioc", "threat-intelligence", "soc", "virustotal", "abuseipdb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.5.0"]

[project.scripts]
ioc-checker = "ioc_checker:main"

[project.urls]
Homepage = "https://github.com/EduardoRochaFernandes/ioc-checker"

[tool.setuptools]
py-modules = ["ioc_checker", "ioc_checker_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Aligned assignments / argument columns are a deliberate style in this codebase.
ignore = ["E221", "E222", "E241", "E201", "E202", "E203", "E251"]
